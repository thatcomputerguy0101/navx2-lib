plugins {
    id "java-library"
    id 'org.wpilib.WPILibRepositoriesPlugin' version '2027.0.0'
}

// WPILib Version
ext.wpilibVersion = "2027.0.0-alpha-7"

repositories {
    mavenCentral()
}
if (project.hasProperty('releaseMode')) {
    wpilibRepositories.addAllReleaseRepositories(project)
} else {
    wpilibRepositories.addAllDevelopmentRepositories(project)
}
/*
task generateJavadocs(type: Javadoc) {
  source = sourceSets.main.allJava
}
*/
dependencies {
    api "org.wpilib.wpilibj:wpilibj-java:${wpilibVersion}"
    api "org.wpilib.ntcore:ntcore-java:${wpilibVersion}"
    api "org.wpilib.wpiutil:wpiutil-java:${wpilibVersion}"
    api "org.wpilib.telemetry:telemetry-java:${wpilibVersion}"
    api "org.wpilib.wpiunits:wpiunits-java:${wpilibVersion}"
    api "org.wpilib.hal:hal-java:${wpilibVersion}"
}

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

sourceSets {
    main {
        java {
            srcDirs = ['../../protocol/java/src', 'src']
        }
    }
}

//build.dependsOn generateJavadocs

apply from: 'publish.gradle'

wrapper {
  gradleVersion = '9.4.1'
}
