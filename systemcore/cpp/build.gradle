plugins {
  id 'cpp'
  id 'org.wpilib.WPILibRepositoriesPlugin' version '2027.0.0'
  id 'org.wpilib.NativeUtils' version '2027.14.3'
  id 'org.wpilib.GradleVsCode' version '2027.0.0'
}

repositories {
    mavenCentral()
}
if (project.hasProperty('releaseMode')) {
    wpilibRepositories.addAllReleaseRepositories(project)
} else {
    wpilibRepositories.addAllDevelopmentRepositories(project)
}

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

apply from: 'config.gradle'

nativeUtils {
  exportsConfigs {
      navx_frc {
      }
  }
}

model {
  components {
    navx_frc(NativeLibrarySpec) {
      appendDebugPathToBinaries(binaries)
      sources {
        cpp {
          source {
            srcDirs 'src'
            include '**/*.cpp'
          }
          exportedHeaders {
            srcDirs 'include', '../../protocol/cpp/include'
          }
        }
      }
      nativeUtils.useRequiredLibrary(it, "wpilibc_shared", "ntcore_shared", "hal_shared", "wpiutil_shared", "wpimath_shared", "telemetry_shared", "catch2_static")
    }
  }
}

build.dependsOn rootProject.generateVendorJson

apply from: 'publish.gradle'
